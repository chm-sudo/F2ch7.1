<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>邏輯獵手：證據追蹤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap');

        /* 基礎字體設定 */
        html, body, div, span, h1, h2, h3, p, button, input {
            font-size: 1.15rem !important; 
            line-height: 1.5 !important;
        }

        body {
            background-color: #fdf6ec;
            background-image: url('https://www.transparenttextures.com/patterns/cardboard-flat.png');
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            body { height: 100dvh; overflow: hidden; }
        }

        .paper-sheet { background: #fff; border: 1px solid #ddd; position: relative; }

        .selectable-text {
            user-select: text !important;
            -webkit-user-select: text !important;
            line-height: 2 !important; 
            color: #2d2d2d;
        }

        .cardboard-panel { background-color: #f5e6d3; border: 2px solid #d4b483; }

        .drop-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            padding: 4px 8px;
            border: 2px solid #d97706;
            background: #fff;
            margin: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #b45309;
        }

        #mc-popover {
            position: fixed;
            display: none;
            background: white;
            border: 2px solid #d97706;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            padding: 10px;
            flex-direction: column;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        #verify-btn {
            width: 100px;
            height: 100px;
            background: #d97706;
            color: white;
            border-radius: 9999px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            border: 4px solid white;
            cursor: pointer;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 邏輯圖文字版樣式 */
        .logic-map {
            background: #fff;
            border: 2px solid #d4b483;
            border-radius: 15px;
            padding: 1.5rem;
            text-align: left;
        }
        .logic-node {
            background: #fffbeb;
            border-left: 5px solid #d97706;
            padding: 8px 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-3 md:p-4 gap-3 md:gap-4">

    <div id="mc-popover"></div>

    <div class="flex justify-between items-center bg-white border-b-4 border-amber-600 p-3 rounded-xl shadow-md flex-none">
        <div class="flex items-center gap-2">
            <span>🔍</span>
            <div class="flex flex-col md:flex-row md:items-baseline md:gap-2">
                <h1 class="text-amber-900 font-black">邏輯獵手：證據追蹤</h1>
                <span class="text-stone-500 font-bold">——《再論包裝》</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="font-bold text-stone-500">錯誤：<span id="fail-counter" class="text-red-600">0</span></div>
            <div id="progress-val" class="font-black text-amber-900">1 / 4</div>
        </div>
    </div>

    <div class="flex-1 flex flex-col md:flex-row gap-3 md:gap-4 md:overflow-hidden min-h-0">
        <div class="flex-[2.2] relative flex flex-col min-h-[60vh] md:min-h-0">
            <div id="scroll-area" class="paper-sheet flex-1 rounded-2xl p-5 md:p-6 overflow-y-auto">
                <div id="text-canvas" class="selectable-text font-serif"></div>
                <div class="h-32"></div>
            </div>
            <button id="verify-btn"><span>✔️</span><span class="font-black">驗證</span></button>
        </div>

        <div class="flex-[2.8] flex flex-col gap-3">
            <div class="cardboard-panel flex-none h-[50vh] md:h-[55%] rounded-2xl p-4 flex flex-col shadow-inner overflow-hidden">
                <div id="hint-container" class="hidden bg-white border border-amber-200 p-2 rounded text-amber-800 mb-2 font-bold"></div>
                <div class="bg-white/95 p-4 rounded-xl border-2 border-amber-200 shadow-sm flex-1 flex flex-col overflow-hidden">
                    <div id="task-info">
                        <span id="task-stage" class="font-black text-amber-600 bg-amber-50 px-2 py-0.5 rounded border">初始化...</span>
                        <p id="task-desc" class="text-stone-800 font-bold mt-2"></p>
                    </div>
                    <div class="flex-1 overflow-y-auto mt-2 flex flex-col">
                        <div id="cloze-area" class="hidden border-t-2 border-dashed border-amber-100 pt-3 mb-2">
                            <div id="cloze-sentence" class="text-stone-800 font-medium bg-amber-50/50 p-3 rounded-lg border border-amber-100"></div>
                        </div>
                        <div id="target-points" class="space-y-2 mt-auto pt-4 w-full"></div>
                    </div>
                </div>
                <div id="feedback-area" class="text-center font-bold mt-1"></div>
                <button id="synth-btn" class="mt-1 w-full py-3 bg-stone-300 text-stone-500 rounded-xl font-black" disabled>等待證據</button>
            </div>
            <div class="flex-1 bg-amber-50/50 border-2 border-dashed border-amber-200 rounded-2xl p-3 flex flex-col overflow-hidden">
                <h3 class="text-amber-800 font-bold mb-2 text-center">📥 證據紀錄</h3>
                <div id="evidence-basket" class="flex-1 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <div id="name-modal" class="modal-overlay">
        <div class="bg-white p-6 rounded-3xl shadow-2xl border-4 border-amber-600 max-w-sm w-full mx-4">
            <h2 class="font-black text-amber-900 mb-4 text-center">任務圓滿完成！</h2>
            <div class="space-y-3">
                <input type="text" id="user-class" placeholder="請輸入班別 (例: 4A)" class="w-full p-3 border-2 border-amber-100 rounded-xl font-bold">
                <input type="number" id="user-num" placeholder="請輸入班號" class="w-full p-3 border-2 border-amber-100 rounded-xl font-bold">
                <input type="text" id="user-name" placeholder="請輸入姓名" class="w-full p-3 border-2 border-amber-100 rounded-xl font-bold">
                <button id="final-submit-btn" class="w-full py-4 bg-amber-600 text-white rounded-xl font-black shadow-lg">生成榮譽證書</button>
            </div>
        </div>
    </div>

    <div id="finish-screen" class="modal-overlay overflow-y-auto py-10">
        <div class="bg-white p-8 rounded-3xl text-center border-8 border-double border-amber-600 max-w-3xl w-full mx-auto shadow-2xl relative">
            <div class="text-amber-900 font-black text-3xl mb-2">榮 譽 證 書</div>
            <p class="mb-6 text-amber-800 text-xl">
                <span id="display-class" class="underline"></span> 班 
                <span id="display-num" class="underline"></span> 號 
                <span id="display-name" class="underline"></span> 同學：
            </p>
            
            <div class="bg-amber-50 p-4 rounded-xl mb-6 inline-block border-2 border-amber-200">
                <p class="text-amber-700 font-bold">恭喜獲得稱號</p>
                <h3 id="display-title" class="font-black text-amber-900 text-2xl"></h3>
            </div>

            <div class="logic-map">
                <h4 class="font-black text-amber-900 mb-4 flex items-center gap-2">
                    <span>📝</span> 《再論包裝》學習總結
                </h4>
                
                <div class="mb-4">
                    <div class="text-sm font-bold text-amber-600 mb-1">【中心論點】</div>
                    <div class="bg-amber-600 text-white p-3 rounded-lg font-bold text-center">
                        應停止過度包裝，珍惜自然資源
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="logic-node">
                        <div class="text-xs font-bold text-amber-600">分論點一</div>
                        <div class="font-bold text-stone-800">包裝成本 > 商品價值<br><span class="text-sm font-normal text-stone-500">(周村燒餅鐵盒例)</span></div>
                    </div>
                    <div class="logic-node">
                        <div class="text-xs font-bold text-amber-600">分論點二</div>
                        <div class="font-bold text-stone-800">製造大量垃圾<br><span class="text-sm font-normal text-stone-500">(處理垃圾困難)</span></div>
                    </div>
                    <div class="logic-node">
                        <div class="text-xs font-bold text-amber-600">分論點三</div>
                        <div class="font-bold text-stone-800">資源並非不竭<br><span class="text-sm font-normal text-stone-500">(應為後代留資源)</span></div>
                    </div>
                </div>

                <div class="mt-4 p-3 bg-stone-100 rounded-lg text-sm text-stone-600 italic">
                    💡 總結：作者透過對比古今包裝，批評捨本逐末的社會現象，呼籲改弦更張。
                </div>
            </div>

            <button onclick="location.reload()" class="mt-8 text-stone-400 font-bold hover:text-amber-600">重新開始挑戰</button>
        </div>
    </div>

    <script>
        const articleText = [
            "❶ 我在這裡寫的「值得擔憂」，不限於中國，而是全世界。",
            "❷ 我曾在本刊上寫過一篇《論包裝》的文章，內容主要是談外面包裝極大而裡面的商品極小的問題。現在這一篇《再論包裝》，主要談的是外面包裝和裡面商品價值的問題。重點有所不同，而令人擔憂則一也。我先舉一個小例子。",
            "❸ 最近有友人從山東歸來，帶給我一些周村燒餅，是當地生產的一種點心。作料異常簡單，不過一點麵粉、芝麻，再加上一點糖或鹽，用水和好，擀成薄皮，做成圓餅，放在爐中烤乾，即為成品，香脆可口，遠近聞名，大概有幾百年的歷史了。因為成本極低，所以價錢不高。過去只是十個或八九個一摞，用白紙一包，即可出售。燒餅吃完，把紙一揉，變成垃圾，佔地也不多。",
            "❹ 常言道：「士別三日，當刮目相看。」豈知這一句話也能應用到周村燒餅身上。現在友人送給我的這些燒餅，完全換了新裝，不是白紙，而是鐵盒，彩繪燙金，光彩奪目。夥頤！我的老朋友闊起來了！我不禁大為驚詫。",
            "❺ 在驚詫之餘，我又不禁憂心忡忡起來。我不是經濟學家，這裡也用不著經濟學。只草草地估算一下，那幾個燒餅能值幾個錢？這金碧輝煌的鐵盒值多少錢？顯然後者比前者要貴得多。可是哪一個有使用價值呢？又顯然是前者。燒餅吃下去，可以充飢，可以轉變成營養成分，增強人的身體。鐵盒，如果只有一、兩個的話，小孩可以拿著玩一玩。如果是成千上萬的話，卻只能變成垃圾，遭人遺棄。《論包裝》中提到的那一些大而無當的包裝，把其中小小的一點商品取出來後，也都成為垃圾。",
            "❻ 這有點像中國古書上的一個典故：「買櫝還珠。」但是，這個典故不過是譏笑捨本逐末，取捨不當而已，那個櫝還是有用的，決不會變成垃圾。古代人生活簡樸，沒有多少垃圾，也決不會自己製造垃圾。到了今天，人類大大地進步了。卻愈來愈蠢了，會自己製造垃圾，以致垃圾成為一個世界性問題。每一個國家的政府都為處理垃圾而大傷腦筋，至今還沒能找到一個行之有效的辦法。如此持續下去，將來人類只能在垃圾堆裏討生活了。",
            "❼ 但是，還有更嚴重的問題。人類衣、食、住、行的資料都取之於大自然。但是，小小的一個地球村裏資源畢竟是有限的。當年蘇東坡說：「惟江上之清風，與山間之明月，耳得之而為聲，目遇之而成色，取之無禁，用之不竭，是造物之無盡藏也。」東坡認為造物無盡藏，是不正確的。造物是有盡藏的，用之是有竭的。可惜到了今天，世人還多是渾渾噩噩，懵渾不懂，毫無反思悔改之意。尤其是那一個以世界警察自居的大國，在使用大自然資源方面，肆無忌憚地浪費，真不禁令人髮指。有識之士已經感覺到，人類已經是「盲人騎瞎馬，夜半臨深池」，但感覺到這種危險者不多。這是事實，並不是我一個人的杞憂。",
            "❽ 我希望有聰明智慧的中國人，懸崖勒馬，改弦更張，再也不製造那一種大而無當的商品包裝和那種金碧輝煌的商品鐵盒，給我們的子孫後代多留下一點大自然的資源。"
        ];

        const gameFlow = [
            { step: 1, evidences: [{ q: "1. 找出：周村燒餅原本的包裝方法", keywords: ["過去只是十個或八九個一摞，用白紙一包"], label: "舊有包裝", hint: "第 ❸ 段" }, { q: "2. 找出：現今周村燒餅的包裝", keywords: ["鐵盒，彩繪燙金，光彩奪目"], label: "新式包裝", hint: "第 ❹ 段" }, { q: "3. 找出：商品價值與包裝成本的對比", keywords: ["後者比前者要貴"], label: "價值倒置", hint: "第 ❺ 段：找出「比」字" }], cloze: "分論點：現代商品{過度包裝}，其成本{遠高於}商品價值，造成{浪費}。", mcOptions: { "過度包裝": ["簡單包裝", "過度包裝"], "遠高於": ["遠低於", "遠高於"], "浪費": ["節約", "浪費"] }, synthesis: "分論一：過度包裝造成價值失衡。" },
            { step: 2, evidences: [{ q: "4. 找出：古代處理垃圾的情況", keywords: ["沒有多少垃圾，也決不會自己製造垃圾"], label: "古代環境", hint: "第 ❻ 段" }, { q: "5. 找出：現代處理垃圾的情況", keywords: ["每一個國家的政府都為處理垃圾而大傷腦筋"], label: "現代問題", hint: "國家的政府的問題" }], cloze: "分論點：這會製造大量{垃圾}，演變成{全球性問題}。", mcOptions: { "垃圾": ["財富", "垃圾"], "全球性問題": ["個人問題", "全球性問題"] }, synthesis: "分論二：垃圾處理已成全球危機。" },
            { step: 3, evidences: [{ q: "6. 找出：文中提及資源性質的描述", keywords: ["資源畢竟是有限的", "造物是有盡藏的，用之是有竭的"], label: "資源危機", hint: "第 ❼ 段" }], cloze: "分論點：自然資源並非{不竭}，若人類繼續{浪費}，資源終會{耗盡}。", mcOptions: { "不竭": ["有限", "不竭"], "浪費": ["珍惜", "浪費"], "耗盡": ["再生", "耗盡"] }, synthesis: "分論三：自然資源並非取之不盡。" },
            { step: 4, evidences: [{ q: "7. 找出：作者對中國人的具體建議", keywords: ["懸崖勒馬", "改弦更張", "再也不製造那一種大而無當的商品包裝"], label: "行動建議", hint: "第 ❽ 段" }, { q: "8. 找出：全文開篇的核心感受", keywords: ["值得擔憂"], label: "核心論點", hint: "第 ❶ 段" }], cloze: "中心論點：過度包裝問題{值得擔憂}。我們應{不再製造大而無當的包裝}。", mcOptions: { "值得擔憂": ["值得擔憂", "不足掛齒"], "不再製造大而無當的包裝": ["加強包裝", "不再製造大而無當的包裝"] }, synthesis: "中心論點：應停止過度包裝，保護資源。" }
        ];

        let currentStepIdx = 0, collectedInStep = 0, totalFail = 0;

        function init() {
            document.getElementById('text-canvas').innerHTML = articleText.map(t => `<p class="mb-4">${t}</p>`).join('');
            document.getElementById('verify-btn').onclick = checkSelection;
            document.getElementById('final-submit-btn').onclick = submitAndFinish;
            updateTask();
        }

        function checkSelection() {
            const selection = window.getSelection();
            const selectedText = selection.toString().trim();
            const flow = gameFlow[currentStepIdx];
            if (!selectedText) { showFeedback("⚠️ 請先在文中選取文字", "text-red-500"); return; }
            const clean = (s) => s.replace(/[\s\r\n\t\(\)\d\.,，。：「」『』!！?？❶-❽]/g, "");
            const cleanedSel = clean(selectedText);
            const target = flow.evidences[collectedInStep];
            const isCorrect = target.keywords.some(k => cleanedSel.includes(clean(k)) || clean(k).includes(cleanedSel));
            
            if (isCorrect && cleanedSel.length >= 2) {
                addEvidence(target.label, selectedText);
                collectedInStep++;
                showFeedback("✓ 正確！", "text-green-600");
                document.getElementById('hint-container').classList.add('hidden');
                selection.removeAllRanges();
                updateTask();
            } else {
                totalFail++;
                document.getElementById('fail-counter').innerText = totalFail;
                showFeedback("✗ 選取不精準", "text-red-500");
                document.getElementById('hint-container').classList.remove('hidden');
                document.getElementById('hint-container').innerText = "提示：" + target.hint;
            }
        }

        function addEvidence(l, t) {
            const d = document.createElement('div');
            d.className = "bg-white p-2 rounded border-l-4 border-amber-600 shadow-sm mb-2 text-sm";
            d.innerHTML = `<b>【${l}】</b> ${t}`;
            document.getElementById('evidence-basket').prepend(d);
        }

        function updateTask() {
            const flow = gameFlow[currentStepIdx];
            document.getElementById('progress-val').innerText = (currentStepIdx + 1) + " / 4";
            const btn = document.getElementById('synth-btn');
            if (collectedInStep < flow.evidences.length) {
                document.getElementById('task-stage').innerText = `搜集證據 (${collectedInStep}/${flow.evidences.length})`;
                document.getElementById('task-desc').innerText = flow.evidences[collectedInStep].q;
                btn.disabled = true;
                btn.className = "mt-1 w-full py-3 bg-stone-300 text-stone-500 rounded-xl font-black";
            } else {
                document.getElementById('task-stage').innerText = "證據已齊全";
                document.getElementById('task-desc').innerText = "請點擊下方按鈕進行邏輯合成";
                btn.disabled = false;
                btn.className = "mt-1 w-full py-3 bg-amber-600 text-white rounded-xl font-black shadow-lg";
                btn.onclick = startCloze;
            }
        }

        function startCloze() {
            document.getElementById('cloze-area').classList.remove('hidden');
            document.getElementById('cloze-sentence').innerHTML = gameFlow[currentStepIdx].cloze.replace(/\{(.+?)\}/g, (m, p) => 
                `<span class="drop-slot" data-answer="${p}" onclick="showMC(this, event)">點擊選擇</span>`
            );
            const btn = document.getElementById('synth-btn');
            btn.innerText = "驗證邏輯";
            btn.onclick = verifyCloze;
        }

        function showMC(slot, e) {
            e.stopPropagation();
            const pop = document.getElementById('mc-popover');
            pop.innerHTML = '';
            gameFlow[currentStepIdx].mcOptions[slot.dataset.answer].forEach(opt => {
                const d = document.createElement('div');
                d.className = "p-3 border-b last:border-0 hover:bg-amber-100 cursor-pointer font-bold";
                d.innerText = opt;
                d.onclick = (ev) => { ev.stopPropagation(); slot.innerText = opt; pop.style.display = 'none'; };
                pop.appendChild(d);
            });
            const r = slot.getBoundingClientRect();
            pop.style.display = 'flex';
            pop.style.top = (r.bottom + window.scrollY) + "px";
            pop.style.left = r.left + "px";
        }

        function verifyCloze() {
            const slots = document.querySelectorAll('.drop-slot');
            let ok = true;
            slots.forEach(s => { if (s.innerText !== s.dataset.answer) ok = false; });
            if (ok) {
                const f = document.createElement('div');
                f.className = "p-2 bg-amber-50 border border-amber-600 text-amber-900 rounded font-black text-sm";
                f.innerText = "📍 " + gameFlow[currentStepIdx].synthesis;
                document.getElementById('target-points').appendChild(f);
                currentStepIdx++; collectedInStep = 0;
                if (currentStepIdx < gameFlow.length) {
                    document.getElementById('cloze-area').classList.add('hidden');
                    updateTask();
                    document.getElementById('synth-btn').innerText = "等待證據";
                } else { document.getElementById('name-modal').style.display = 'flex'; }
            } else { totalFail++; showFeedback("✗ 邏輯推理錯誤", "text-red-500"); }
        }

        function submitAndFinish() {
            const c = document.getElementById('user-class').value;
            const n = document.getElementById('user-num').value;
            const nm = document.getElementById('user-name').value;
            if(!c || !n || !nm) return alert("請填寫完整資料");
            document.getElementById('display-class').innerText = c;
            document.getElementById('display-num').innerText = n;
            document.getElementById('display-name').innerText = nm;
            document.getElementById('display-title').innerText = totalFail <= 3 ? "🌿 環保包裝大師" : "🛡️ 邏輯守護者";
            document.getElementById('name-modal').style.display = 'none';
            document.getElementById('finish-screen').style.display = 'flex';
        }

        function showFeedback(m, c) {
            const el = document.getElementById('feedback-area');
            el.innerText = m; el.className = "text-center font-bold mt-1 " + c;
        }

        window.onclick = () => document.getElementById('mc-popover').style.display = 'none';
        window.onload = init;
    </script>
</body>
</html>
