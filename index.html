<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>邏輯獵手：證據追蹤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            background-color: #fdf6ec;
            background-image: url('https://www.transparenttextures.com/patterns/cardboard-flat.png');
            font-family: 'Noto Sans TC', sans-serif;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom); /* 確保 iPad 底部安全區域 */
        }

        .paper-sheet {
            background: #fff;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        .selectable-text {
            user-select: text !important;
            -webkit-user-select: text !important;
            line-height: 2.2;
            font-size: 1.2rem;
            color: #2d2d2d;
            -webkit-touch-callout: default;
        }

        .cardboard-panel {
            background-color: #f5e6d3;
            border: 2px solid #d4b483;
        }

        .drop-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            height: 36px;
            border: 2px solid #d97706;
            background: #fff;
            margin: 0 4px;
            vertical-align: middle;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #b45309;
        }

        #mc-popover {
            position: fixed;
            display: none;
            background: white;
            border: 2px solid #d97706;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            padding: 10px;
            flex-direction: column;
            gap: 6px;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        #verify-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
        }

        #verify-btn {
            width: 75px;
            height: 75px;
            background: #d97706;
            color: white;
            border-radius: 9999px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            border: 4px solid white;
            touch-action: manipulation;
        }

        #verify-btn:active {
            transform: scale(0.9);
            background: #b45309;
        }

        .evidence-item {
            background: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border-left: 4px solid #d97706;
            font-size: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="p-3 md:p-4 gap-3 md:gap-4">

    <div id="mc-popover"></div>

    <div class="flex justify-between items-center bg-white border-b-4 border-amber-600 p-3 rounded-xl shadow-md">
        <div class="flex items-center gap-2">
            <span class="text-xl">🔍</span>
            <h1 class="text-amber-900 font-black text-base md:text-lg">邏輯獵手：證據追蹤</h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-xs font-bold text-stone-500">錯誤：<span id="fail-counter" class="text-red-600">0</span></div>
            <div id="progress-val" class="text-lg font-black text-amber-900">1 / 4</div>
        </div>
    </div>

    <div class="flex-1 flex flex-col md:flex-row gap-3 md:gap-4 overflow-hidden min-h-0">
        
        <div class="flex-[2.2] relative flex flex-col overflow-hidden min-h-0">
            <div id="scroll-area" class="paper-sheet flex-1 rounded-2xl p-5 md:p-6 overflow-y-auto">
                <div class="mb-4 flex flex-col gap-2">
                    <div class="flex items-center gap-2">
                        <span class="bg-amber-600 text-white px-2 py-0.5 rounded text-[10px] font-bold">任務目標</span>
                        <span class="text-xs text-amber-800 font-bold">請選取文中對應的證據文字</span>
                    </div>
                    <div class="bg-amber-100 border-l-4 border-amber-400 p-2 rounded">
                        <p class="text-[11px] text-amber-900 leading-tight">
                            💡 <b>操作提示：</b>長按文字，拉出藍色選取區域，再點擊下方「驗證」按鈕。
                        </p>
                    </div>
                </div>
                <div id="text-canvas" class="selectable-text font-serif"></div>
                <div class="h-28"></div>
            </div>

            <div id="verify-container">
                <button id="verify-btn" type="button">
                    <span class="text-xl">✔️</span>
                    <span class="text-[10px] font-black uppercase">Verify</span>
                </button>
            </div>
        </div>

        <div class="flex-[2.8] flex flex-col gap-3 min-h-0 overflow-hidden">
            <div class="cardboard-panel flex-1 rounded-2xl p-4 flex flex-col shadow-inner overflow-hidden min-h-0">
                <div id="hint-container" class="hidden bg-white/80 border border-amber-200 p-2 rounded text-amber-800 text-[11px] mb-2"></div>
                
                <div id="synth-container" class="bg-white/95 p-4 rounded-xl border-2 border-amber-200 shadow-sm flex-1 flex flex-col overflow-hidden min-h-0">
                    <div id="task-info" class="flex-none">
                        <span id="task-stage" class="text-[10px] font-black text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">初始化中...</span>
                        <p id="task-desc" class="text-stone-800 font-bold leading-tight text-base mt-2"></p>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto mt-2 pr-1">
                        <div id="cloze-area" class="hidden border-t-2 border-dashed border-amber-100 pt-3 mb-3">
                            <div id="cloze-sentence" class="text-stone-800 leading-relaxed text-base font-medium bg-amber-50/50 p-3 rounded-lg border border-amber-100"></div>
                        </div>
                        <div id="target-points" class="space-y-2"></div>
                    </div>
                </div>

                <div id="feedback-area" class="h-5 text-center text-[10px] font-bold mt-1"></div>
                <button id="synth-btn" class="mt-1 w-full py-3 bg-stone-300 text-stone-500 rounded-xl font-black text-base shadow-sm transition-all" disabled>等待證據</button>
            </div>

            <div class="h-24 md:h-32 bg-amber-50/50 border-2 border-dashed border-amber-200 rounded-2xl p-3 flex flex-col overflow-hidden">
                <h3 class="text-amber-800 font-bold text-[10px] mb-2 text-center flex-none">📥 證據紀錄</h3>
                <div id="evidence-basket" class="flex-1 overflow-y-auto space-y-2 text-[10px]"></div>
            </div>
        </div>
    </div>

    <div id="name-modal" class="modal-overlay">
        <div class="bg-white p-6 rounded-3xl shadow-2xl border-4 border-amber-600 max-w-sm w-full mx-4">
            <h2 class="text-xl font-black text-amber-900 mb-4 text-center">任務完成！</h2>
            <div class="space-y-3">
                <input type="text" id="user-class" placeholder="請輸入班別 (如 4A)" class="w-full p-3 border-2 border-amber-100 rounded-xl font-bold text-sm">
                <input type="text" id="user-name" placeholder="請輸入姓名" class="w-full p-3 border-2 border-amber-100 rounded-xl font-bold text-sm">
                <button id="final-submit-btn" class="w-full py-4 bg-amber-600 text-white rounded-xl font-black text-lg shadow-lg">提交並領取證書</button>
            </div>
        </div>
    </div>

    <div id="finish-screen" class="modal-overlay">
        <div class="bg-white p-6 rounded-3xl text-center border-8 border-double border-amber-600 max-w-sm w-full mx-4">
            <h2 class="text-2xl font-black text-amber-900 mb-2">榮譽證書</h2>
            <p class="text-sm mb-2"><span id="display-class" class="font-bold"></span> <span id="display-name" class="font-bold"></span> 同學：</p>
            <p class="text-xs mb-4 text-stone-700">你在任務中成功重構了《值得擔憂》的環保邏輯鏈條！</p>
            <div class="bg-amber-100 p-3 rounded-lg mb-4">
                <h3 id="display-title" class="text-lg font-bold text-amber-900"></h3>
            </div>
            <button onclick="location.reload()" class="text-amber-600 text-xs underline">重新開始</button>
        </div>
    </div>

    <script>
        // 資料定義與 JS 邏輯 (保持穩定)
        const articleText = [
            "(1) 我在這裡寫的「值得擔憂」，不限於中國，而是全世界。",
            "(2) 最近有友人從山東歸來，帶給我一些周村燒餅。過去只是十個或八九個一摞，用白紙一包，即可出售。燒餅吃完，把紙一揉，變成垃圾，佔地也不多。",
            "(3) 現在完全換了新裝，不是白紙，而是鐵盒，彩繪燙金，光彩奪目。夥頤！我的老朋友闊起來了！這幾個燒餅能值幾個錢？這金碧輝煌的鐵盒值多少錢？顯然後者比前者要貴得多。可是哪一個有使用價值呢？又顯然是前者。",
            "(4) 到了今天，人類大大地進步了，卻愈來愈蠢了，會自己製造垃圾，以致垃圾成為一個世界性問題。將來人類只能在垃圾堆裏討生活了。我看一看古代人，他們生活多麼簡樸，那裡有多少垃圾。現在每一個國家都為處理垃圾而大傷腦筋。",
            "(5) 地球村裏資源畢竟是有限制的。東坡認為造物無盡藏，是不正確的。造物是有盡藏的，用之是有竭的。有識之士已經感覺到，人類已經是「盲人騎瞎馬，夜半臨深池」。",
            "(6) 我希望有聰明智慧的中國人，懸崖勒馬，改弦更張，再也不製造那一種大而無當的商品包裝，給我們的子孫後代多留下一點大自然的資源。"
        ];

        const gameFlow = [
            {
                step: 1,
                evidences: [
                    { q: "1. 找出：周村燒餅原本的包裝方法", keywords: ["過去", "白紙一包"], label: "舊有包裝", hint: "第 (2) 段：白紙。" },
                    { q: "2. 找出：現今周村燒餅的包裝", keywords: ["現在", "鐵盒", "彩繪燙金"], label: "新式包裝", hint: "第 (3) 段：鐵盒。" },
                    { q: "3. 找出：商品價值與包裝成本的對比", keywords: ["後者比前者要貴"], label: "價值倒置", hint: "第 (3) 段：後者更貴。" }
                ],
                cloze: "分論點：現代商品{過度包裝}，其成本{遠高於}商品價值，造成{浪費}。",
                mcOptions: { "過度包裝": ["簡單包裝", "過度包裝", "沒有包裝"], "遠高於": ["遠低於", "等同於", "遠高於"], "浪費": ["節約", "浪費", "美觀"] },
                synthesis: "分論一：過度包裝造成價值失衡。"
            },
            {
                step: 2,
                evidences: [
                    { q: "4. 找出：古今處理垃圾情況的對比", keywords: ["古代人", "簡樸", "大傷腦筋"], label: "環境問題", hint: "第 (4) 段：大傷腦筋。" }
                ],
                cloze: "分論點：這會製造大量{垃圾}，演變成{全球性問題}。",
                mcOptions: { "垃圾": ["財富", "垃圾", "糧食"], "全球性問題": ["個人問題", "全球性問題"] },
                synthesis: "分論二：垃圾處理已成全球危機。"
            },
            {
                step: 3,
                evidences: [
                    { q: "5. 找出：文中提及資源性質的描述", keywords: ["無盡藏", "不正確", "有竭"], label: "資源危機", hint: "第 (5) 段：有竭。" }
                ],
                cloze: "分論點：自然資源並非{不竭}，若人類繼續{浪費}，資源終會{耗盡}。",
                mcOptions: { "不竭": ["有限", "不竭"], "浪費": ["珍惜", "浪費"], "耗盡": ["再生", "耗盡"] },
                synthesis: "分論三：自然資源並非取之不盡。"
            },
            {
                step: 4,
                evidences: [
                    { q: "6. 找出：作者對中國人的具體建議", keywords: ["懸崖勒馬", "改弦更張"], label: "行動建議", hint: "第 (6) 段：改弦更張。" },
                    { q: "7. 找出：全文開篇的核心感受", keywords: ["值得擔憂"], label: "核心論點", hint: "第 (1) 段：值得擔憂。" }
                ],
                cloze: "中心論點：過度包裝問題{值得擔憂}。我們應{不再製造大而無當的包裝}。",
                mcOptions: { "值得擔憂": ["值得擔憂", "不足掛齒"], "不再製造大而無當的包裝": ["加強包裝", "不再製造大而無當的包裝"] },
                synthesis: "中心論點：應停止過度包裝，保護資源。"
            }
        ];

        let currentStepIdx = 0, collectedInStep = 0, totalFail = 0;

        function init() {
            try {
                const canvas = document.getElementById('text-canvas');
                canvas.innerHTML = articleText.map(t => `<p class="mb-4">${t}</p>`).join('');
                document.getElementById('verify-btn').onclick = checkSelection;
                document.getElementById('final-submit-btn').onclick = submitAndFinish;
                updateTask();
            } catch (err) { alert("啟動錯誤: " + err.message); }
        }

        function checkSelection() {
            const selection = window.getSelection();
            const selectedText = selection.toString().trim();
            const flow = gameFlow[currentStepIdx];
            if (collectedInStep >= flow.evidences.length) return;
            if (!selectedText) { showFeedback("⚠️ 請先在左側文中選取文字", "text-red-500"); return; }

            const clean = (s) => s.replace(/[\s\r\n\t\(\)\d\.,，。：「」『』!！?？]/g, "");
            const cleaned = clean(selectedText);
            const target = flow.evidences[collectedInStep];
            const isCorrect = target.keywords.some(k => cleaned.includes(clean(k)));

            if (isCorrect && cleaned.length >= 2) {
                addEvidence(target.label, selectedText);
                collectedInStep++;
                showFeedback("✓ 正確！", "text-green-600");
                document.getElementById('hint-container').classList.add('hidden');
                selection.removeAllRanges(); 
                updateTask();
            } else {
                totalFail++;
                document.getElementById('fail-counter').innerText = totalFail;
                showFeedback("✗ 不夠精準，再試一次", "text-red-500");
                const hc = document.getElementById('hint-container');
                hc.classList.remove('hidden');
                hc.innerText = "💡 提示：" + target.hint;
            }
        }

        function addEvidence(label, text) {
            const div = document.createElement('div');
            div.className = "evidence-item";
            div.innerHTML = `<b>【${label}】</b> ${text.substring(0, 20)}...`;
            const basket = document.getElementById('evidence-basket');
            basket.insertBefore(div, basket.firstChild);
        }

        function updateTask() {
            const flow = gameFlow[currentStepIdx];
            document.getElementById('progress-val').innerText = (currentStepIdx + 1) + " / 4";
            const btn = document.getElementById('synth-btn');
            
            if (collectedInStep < flow.evidences.length) {
                document.getElementById('task-stage').innerText = `提取中 (${collectedInStep}/${flow.evidences.length})`;
                document.getElementById('task-desc').innerText = flow.evidences[collectedInStep].q;
                btn.disabled = true;
                btn.className = "mt-1 w-full py-3 bg-stone-300 text-stone-400 rounded-xl font-black";
            } else {
                document.getElementById('task-stage').innerText = "證據備齊";
                document.getElementById('task-desc').innerText = "證據收集完成，點擊下方按鈕合成邏輯！";
                btn.disabled = false;
                btn.className = "mt-1 w-full py-3 bg-amber-600 text-white rounded-xl font-black shadow-lg";
                btn.onclick = startCloze;
            }
        }

        function startCloze() {
            const flow = gameFlow[currentStepIdx];
            document.getElementById('cloze-area').classList.remove('hidden');
            document.getElementById('cloze-sentence').innerHTML = flow.cloze.replace(/\{(.+?)\}/g, (m, p1) => 
                `<span class="drop-slot" data-answer="${p1}" onclick="showMC(this, event)">點擊選擇</span>`
            );
            const btn = document.getElementById('synth-btn');
            btn.innerText = "驗證邏輯";
            btn.onclick = verifyCloze;
        }

        function showMC(slot, event) {
            event.stopPropagation();
            const popover = document.getElementById('mc-popover');
            popover.innerHTML = '';
            const opts = gameFlow[currentStepIdx].mcOptions[slot.dataset.answer];
            opts.forEach(opt => {
                const div = document.createElement('div');
                div.className = "p-3 border-b last:border-0 active:bg-amber-100 cursor-pointer text-sm font-bold";
                div.innerText = opt;
                div.onclick = function(e) {
                    e.stopPropagation();
                    slot.innerText = opt;
                    slot.style.background = "#fffbeb";
                    popover.style.display = 'none';
                };
                popover.appendChild(div);
            });
            const rect = slot.getBoundingClientRect();
            popover.style.display = 'flex';
            popover.style.top = (rect.bottom + window.scrollY) + "px";
            popover.style.left = rect.left + "px";
        }

        function verifyCloze() {
            const slots = document.querySelectorAll('.drop-slot');
            let ok = true, filled = true;
            slots.forEach(s => {
                if (s.innerText.includes("點擊")) filled = false;
                if (s.innerText !== s.dataset.answer) ok = false;
            });
            if (!filled) { showFeedback("請完成填空", "text-amber-600"); return; }
            if (ok) { showFeedback("✓ 合成成功！", "text-green-600"); finalizeStep(); }
            else { totalFail++; document.getElementById('fail-counter').innerText = totalFail; showFeedback("✗ 邏輯有誤，請重選", "text-red-500"); }
        }

        function finalizeStep() {
            const f = gameFlow[currentStepIdx];
            const p = document.createElement('div');
            p.className = "p-2 bg-white border-l-4 border-amber-600 text-xs font-bold shadow-sm mb-2";
            p.innerText = "📍 " + f.synthesis;
            document.getElementById('target-points').appendChild(p);
            currentStepIdx++;
            collectedInStep = 0;
            setTimeout(() => {
                if (currentStepIdx < gameFlow.length) {
                    document.getElementById('cloze-area').classList.add('hidden');
                    updateTask();
                    document.getElementById('synth-btn').innerText = "等待證據";
                } else { document.getElementById('name-modal').style.display = 'flex'; }
            }, 800);
        }

        function submitAndFinish() {
            const uClass = document.getElementById('user-class').value.trim();
            const uName = document.getElementById('user-name').value.trim();
            if (!uClass || !uName) { alert("請填寫班別與姓名"); return; }
            document.getElementById('display-class').innerText = uClass;
            document.getElementById('display-name').innerText = uName;
            document.getElementById('display-title').innerText = totalFail <= 3 ? "🌿 環保包裝美學大師" : "🛡️ 拒絕虛榮包裝先鋒";
            document.getElementById('name-modal').style.display = 'none';
            document.getElementById('finish-screen').style.display = 'flex';
        }

        function showFeedback(m, c) {
            const el = document.getElementById('feedback-area');
            el.innerText = m;
            el.className = "h-5 text-center text-[10px] font-bold " + c;
        }

        window.onclick = function() { document.getElementById('mc-popover').style.display = 'none'; };
        window.onload = init;
    </script>
</body>
</html>
