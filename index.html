<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>邏輯獵手：驗證按鈕優化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            background-color: #fdf6ec;
            background-image: url('https://www.transparenttextures.com/patterns/cardboard-flat.png');
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            /* 修正 iPad 橡皮筋回彈效果 */
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .paper-sheet {
            background: #fff;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
            position: relative;
            -webkit-overflow-scrolling: touch; /* 優化 iPad 滾動 */
        }

        .selectable-text {
            user-select: text !important;
            -webkit-user-select: text !important;
            line-height: 2.2;
            font-size: 1.2rem;
            color: #2d2d2d;
            /* 確保在 iPad 上點擊不會意外跳出系統選單 */
            -webkit-touch-callout: default;
        }

        .cardboard-panel {
            background-color: #f5e6d3;
            border: 2px solid #d4b483;
        }

        .drop-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            height: 36px;
            border: 2px solid #d97706;
            background: #fff;
            margin: 0 4px;
            vertical-align: middle;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #b45309;
            /* 防止選取文字時選到按鈕文字 */
            user-select: none;
            -webkit-user-select: none;
        }

        #mc-popover {
            position: fixed;
            display: none;
            background: white;
            border: 2px solid #d97706;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            padding: 10px;
            flex-direction: column;
            gap: 6px;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        #verify-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            /* 確保按鈕在最上層 */
            pointer-events: auto;
        }

        #verify-btn {
            width: 80px;
            height: 80px;
            background: #d97706;
            color: white;
            border-radius: 9999px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px
