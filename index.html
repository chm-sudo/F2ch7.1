<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邏輯獵手：再論包裝</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap');
        html, body { height: 100%; margin: 0; background-color: #fdf6ec; font-family: 'Noto Sans TC', sans-serif; }
        .game-container { display: flex; flex-direction: column; height: 100vh; padding: 10px; box-sizing: border-box; }
        .main-content { display: flex; flex: 1; gap: 15px; overflow: hidden; margin-top: 10px; }
        .left-panel { flex: 1.2; display: flex; flex-direction: column; position: relative; background: white; border-radius: 15px; border: 1px solid #ddd; overflow: hidden; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .selectable-text { padding: 20px; line-height: 2 !important; font-size: 1.2rem; user-select: text !important; -webkit-user-select: text !important; }
        #verify-btn { 
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 90px; height: 90px; background: #d97706; color: white;
            border-radius: 50%; border: 4px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 1000; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-direction: column;
            cursor: pointer; user-select: none; -webkit-user-select: none;
        }
        #verify-btn:active { background: #b45309; transform: translateX(-50%) scale(0.95); }
        .cardboard-panel { background-color: #f5e6d3; border: 2px solid #d4b483; border-radius: 15px; padding: 12px; display: flex; flex-direction: column; }
        .drop-slot { display: inline-flex; border: 2px solid #d97706; padding: 2px 8px; margin: 2px; border-radius: 6px; background: white; color: #b45309; font-weight: bold; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 11000; backdrop-filter: blur(4px); }
        #mc-popover { position: fixed; display: none; background: white; border: 2px solid #d97706; border-radius: 10px; z-index: 10000; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div id="mc-popover"></div>
    <div class="game-container">
        <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow border-b-4 border-amber-600">
            <h1 class="font-black text-amber-900 text-lg">邏輯獵手：再論包裝</h1>
            <div class="flex gap-4 font-bold text-sm">
                <span>錯誤：<span id="fail-counter" class="text-red-600">0</span></span>
                <span>進度：<span id="progress-val">1 / 4</span></span>
            </div>
        </div>
        <div class="main-content">
            <div class="left-panel">
                <div class="overflow-y-auto flex-1">
                    <div id="text-canvas" class="selectable-text font-serif"></div>
                    <div style="height: 120px;"></div>
                </div>
                <button id="verify-btn" onpointerdown="event.preventDefault(); checkSelection();"><span>✔️</span><span>驗證</span></button>
            </div>
            <div class="right-panel">
                <div class="cardboard-panel flex-1 overflow-hidden">
                    <div class="bg-white/90 p-3 rounded-lg flex-1 flex flex-col overflow-hidden">
                        <span id="task-stage" class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs font-bold w-fit">任務載入中...</span>
                        <p id="task-desc" class="font-black text-stone-900 mt-2 text-base"></p>
                        <div class="flex-1 overflow-y-auto border-t pt-2 mt-2">
                            <div id="cloze-area" class="hidden bg-amber-50 p-3 rounded-lg mb-2">
                                <div id="cloze-sentence" class="font-bold text-stone-800"></div>
                            </div>
                            <div id="target-points" class="space-y-2"></div>
                        </div>
                    </div>
                    <div id="feedback-area" class="text-center h-6 text-sm font-bold mt-1"></div>
                    <button id="synth-btn" class="w-full py-3 mt-2 rounded-xl font-black bg-stone-300 text-stone-500" disabled>等待證據</button>
                </div>
                <div class="bg-amber-50/50 border-2 border-dashed border-amber-200 rounded-xl p-2 flex-0.4 overflow-y-auto text-xs">
                    <h3 class="text-center font-bold text-amber-800 mb-1">📥 證據紀錄</h3>
                    <div id="evidence-basket-content"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="name-modal" class="modal-overlay">
        <div class="bg-white p-6 rounded-2xl w-80 text-center">
            <h2 class="font-black mb-4">解密成功！</h2>
            <input type="text" id="user-class" placeholder="班別" class="w-full p-2 mb-2 border rounded">
            <input type="number" id="user-num" placeholder="班號" class="w-full p-2 mb-2 border rounded">
            <input type="text" id="user-name" placeholder="姓名" class="w-full p-2 mb-4 border rounded">
            <button id="final-submit-btn" class="w-full py-3 bg-amber-600 text-white rounded-lg font-bold">生成證書</button>
        </div>
    </div>

    <div id="finish-screen" class="modal-overlay">
        <div class="bg-white p-6 rounded-3xl max-w-2xl w-full mx-4 text-center border-8 border-amber-600 shadow-2xl overflow-y-auto">
            <h2 class="text-2xl font-black text-amber-900 mb-4 italic">榮譽證書</h2>
            <p class="font-bold mb-4 text-lg"><span id="display-class"></span> 班 <span id="display-num"></span> 號 <span id="display-name"></span> 同學</p>
            <div id="final-summary" class="text-left bg-stone-50 p-4 rounded-xl text-sm leading-relaxed border"></div>
            <button onclick="location.reload()" class="mt-6 font-bold text-stone-400 underline">重新挑戰</button>
        </div>
    </div>

    <script>
        const articleText = [
            "❶ 我在這裡寫的「值得擔憂」，不限於中國，而是全世界。",
            "❷ 我曾在本刊上寫過一篇《論包裝》的文章，內容主要是談外面包裝極大而裡面的商品極小的問題。現在這一篇《再論包裝》，主要談的是外面包裝和裡面商品價值的問題。重點有所不同，而令人擔憂則一也。我先舉一個小例子。",
            "❸ 最近有友人從山東歸來，帶給我一些周村燒餅，是當地生產的一種點心。作料異常簡單，不過一點麵粉、芝麻，再加上一點糖或鹽，用水和好，擀成薄皮，做成圓餅，放在爐中烤乾，即為成品，香脆可口，遠近聞名，大概有幾百年的歷史了。因為成本極低，所以價錢不高。過去只是十個或八九個一摞，用白紙一包，即可出售。燒餅吃完，把紙一揉，變成垃圾，佔地也不多。",
            "❹ 常言道：「士別三日，當刮目相看。」豈知這一句話也能應用到周村燒餅身上。現在友人送給我的這些燒餅，完全換了新裝，不是白紙，而是鐵盒，彩繪燙金，光彩奪目。夥頤！我的老朋友闊起來了！我不禁大為驚詫。",
            "❺ 在驚詫之餘，我又不禁憂心忡忡起來。我不是經濟學家，這裡也用不著經濟學。只草草地估算一下，那幾個燒餅能值幾個錢？這金碧輝煌的鐵盒值多少錢？顯然後者比前者要貴得多。可是哪一個有使用價值呢？又顯然是前者。燒餅吃下去，可以充飢，可以轉變成營養成分，增強人的身體。鐵盒，如果只有一、兩個的話，小孩可以拿著玩一玩。如果是成千上萬的話，卻只能變成垃圾，遭人遺棄。《論包裝》中提到的那一些大而無當的包裝，把其中小小的一點商品取出來後，也都成為垃圾。",
            "❻ 這有點像中國古書上的一個典故：「買櫝還珠。」但是，這個典故不過是譏笑捨本逐末，取捨不當而已，那個櫝還是有用的，決不會變成垃圾。古代人生活簡樸，沒有多少垃圾，也決不會自己製造垃圾。到了今天，人類大大地進步了。卻愈來愈蠢了，會自己製造垃圾，以致垃圾成為一個世界性問題。每一個國家的政府都為處理垃圾而大傷腦筋，至今還沒能找到一個行之有效的辦法。如此持續下去，將來人類只能在垃圾堆裏討生活了。",
            "❼ 但是，還有更嚴重的問題。人類衣、食、住、行的資料都取之於大自然。但是，小小的一個地球村裏資源畢竟是有限的。當年蘇東坡說：「惟江上之清風，與山間之明月，耳得之而為聲，目遇之而成色，取之無禁，用之不竭，是造物之無盡藏也。」東坡認為造物無盡藏，是不正確的。造物是有盡藏的，用之是有竭的。可惜到了今天，世人還多是渾渾噩噩，懵渾不懂，毫無反思悔改之意。尤其是那一個以世界警察自居的大國，在使用大自然資源方面，肆無忌憚地浪費，真不禁令人髮指。有識之士已經感覺到，人類已經是「盲人騎瞎馬，夜半臨深池」，但感覺到這種危險者不多。這是事實，並不是我一個人的杞憂。",
            "❽ 我希望有聰明智慧的中國人，懸崖勒馬，改弦更張，再也不製造那一種大而無當的商品包裝和那種金碧輝煌的商品鐵盒，給我們的子孫後代多留下一點大自然的資源。"
        ];

        const gameFlow = [
            { step: 1, evidences: [
                { q: "1. 找出：周村燒餅原本的包裝方法", keywords: ["過去只是十個或八九個一摞，用白紙一包"], label: "舊有包裝" },
                { q: "2. 找出：現今周村燒餅的包裝", keywords: ["鐵盒，彩繪燙金，光彩奪目"], label: "新裝" },
                { q: "3. 找出：商品價值與包裝成本的對比", keywords: ["後者比前者要貴得多"], label: "價值倒置" }
            ], cloze: "分論點：現代商品{過度包裝}，其成本{遠高於}商品價值，造成{浪費}。", mcOptions: { "過度包裝": ["簡單包裝", "過度包裝"], "遠高於": ["遠低於", "遠高於"], "浪費": ["節約", "浪費"] }, synthesis: "分論一：過度包裝造成價值失衡。" },
            
            { step: 2, evidences: [
                { q: "4. 找出：古代處理垃圾的情況", keywords: ["沒有多少垃圾，也決不會自己製造垃圾"], label: "古代" },
                { q: "5. 找出：現代處理垃圾的情況", keywords: ["每一個國家的政府都為處理垃圾而大傷腦筋"], label: "現代危機" }
            ], cloze: "分論點：這會製造大量{垃圾}，演變成{全球性問題}。", mcOptions: { "垃圾": ["財富", "垃圾"], "全球性問題": ["個人問題", "全球性問題"] }, synthesis: "分論二：垃圾處理已成全球危機。" },
            
            { step: 3, evidences: [
                { q: "6. 找出：文中提及資源性質的描述", keywords: ["資源畢竟是有限的", "造物是有盡藏的"], label: "資源" }
            ], cloze: "分論點：自然資源並非{不竭}，若人類繼續{浪費}，資源終會{耗盡}。", mcOptions: { "不竭": ["有限", "不竭"], "浪費": ["珍惜", "浪費"], "耗盡": ["再生", "耗盡"] }, synthesis: "分論三：自然資源並非取之不盡。" },
            
            { step: 4, evidences: [
                { q: "7. 找出：作者對中國人的具體建議", keywords: ["再也不製造那一種大而無當的商品包裝"], label: "具體建議" },
                { q: "8. 找出：全文開篇的核心感受", keywords: ["值得擔憂"], label: "核心論點" }
            ], cloze: "中心論點：過度包裝問題{值得擔憂}。我們應{不再製造大而無當的包裝}。", mcOptions: { "值得擔憂": ["值得擔憂", "不足掛齒"], "不再製造大而無當的包裝": ["加強包裝", "不再製造大而無當的包裝"] }, synthesis: "中心論點：應停止過度包裝，保護資源。" }
        ];

        let currentStepIdx = 0, collectedInStep = 0, totalFail = 0;
        const clean = (s) => s.replace(/[\s\r\n\t\(\)\d\.,，。：「」『』!！?？❶-❽]/g, "");

        function checkSelection() {
            const sel = window.getSelection().toString().trim();
            if (!sel || sel.length < 2) return showFeedback("⚠️ 請先選取文字內容", "text-red-500");
            const target = gameFlow[currentStepIdx].evidences[collectedInStep];
            const isCorrect = target.keywords.some(k => {
                const ck = clean(k), cs = clean(sel);
                return (cs.includes(ck) || ck.includes(cs)) && Math.abs(cs.length - ck.length) <= 5;
            });
            if (isCorrect) {
                const d = document.createElement('div'); d.className = "bg-white p-1 mb-1 border-l-2 border-amber-600 pl-2";
                d.innerHTML = `<b>【${target.label}】</b> ${sel.substring(0,25)}...`;
                document.getElementById('evidence-basket-content').prepend(d);
                collectedInStep++; showFeedback("✓ 正確！", "text-green-600");
                window.getSelection().removeAllRanges(); updateTask();
            } else {
                totalFail++; document.getElementById('fail-counter').innerText = totalFail;
                showFeedback("✗ 不夠精準，再試一次", "text-red-500");
            }
        }

        function updateTask() {
            const flow = gameFlow[currentStepIdx];
            document.getElementById('progress-val').innerText = (currentStepIdx + 1) + " / 4";
            const btn = document.getElementById('synth-btn');
            if (collectedInStep < flow.evidences.length) {
                document.getElementById('task-stage').innerText = `搜集證據 (${collectedInStep}/${flow.evidences.length})`;
                document.getElementById('task-desc').innerText = flow.evidences[collectedInStep].q;
                btn.disabled = true; btn.className = "w-full py-3 mt-2 rounded-xl bg-stone-300 text-stone-500";
            } else {
                document.getElementById('task-stage').innerText = "證據齊全";
                document.getElementById('task-desc').innerText = "點擊按鈕合成邏輯";
                btn.disabled = false; btn.className = "w-full py-3 mt-2 rounded-xl bg-amber-600 text-white shadow-lg cursor-pointer";
                btn.onclick = startCloze;
            }
        }

        function startCloze() {
            document.getElementById('cloze-area').classList.remove('hidden');
            document.getElementById('cloze-sentence').innerHTML = gameFlow[currentStepIdx].cloze.replace(/\{(.+?)\}/g, (m, p) => `<span class="drop-slot" data-answer="${p}" onclick="showMC(this, event)">點擊選擇</span>`);
            const btn = document.getElementById('synth-btn'); btn.innerText = "驗證邏輯"; btn.onclick = verifyCloze;
        }

        function showMC(slot, e) {
            e.stopPropagation(); const pop = document.getElementById('mc-popover'); pop.innerHTML = '';
            gameFlow[currentStepIdx].mcOptions[slot.dataset.answer].forEach(opt => {
                const d = document.createElement('div'); d.className = "p-3 border-b cursor-pointer font-bold hover:bg-amber-100";
                d.innerText = opt; d.onclick = (ev) => { ev.stopPropagation(); slot.innerText = opt; pop.style.display = 'none'; };
                pop.appendChild(d);
            });
            const r = slot.getBoundingClientRect(); pop.style.display = 'flex'; pop.style.top = (r.bottom + window.scrollY + 5) + "px"; pop.style.left = r.left + "px";
        }

        function verifyCloze() {
            if (Array.from(document.querySelectorAll('.drop-slot')).every(s => s.innerText === s.dataset.answer)) {
                const f = document.createElement('div'); f.className = "p-2 bg-white border border-amber-600 text-amber-900 rounded font-bold text-xs";
                f.innerText = "📍 " + gameFlow[currentStepIdx].synthesis;
                document.getElementById('target-points').appendChild(f);
                currentStepIdx++; collectedInStep = 0;
                if (currentStepIdx < gameFlow.length) { document.getElementById('cloze-area').classList.add('hidden'); updateTask(); document.getElementById('synth-btn').innerText = "等待證據"; }
                else { showFinal(); }
            } else { totalFail++; showFeedback("✗ 邏輯推理錯誤", "text-red-500"); }
        }

        function showFinal() {
            document.getElementById('final-summary').innerHTML = `
                <p class="font-black text-center text-amber-800 border-b pb-2 mb-3 text-lg">📝 《再論包裝》學習總結</p>
                <div class="mb-3"><b>● 中心論點：</b>商品過度包裝的問題。</div>
                <div class="mb-3"><b>● 分論一：</b>包裝成本遠高於商品價值，造成浪費。</div>
                <div class="mb-3"><b>● 分論二：</b>過度包裝製造垃圾，演變成全球性問題。</div>
                <div class="mb-3"><b>● 分論三：</b>自然資源並非不竭，若繼續浪費終會耗盡。</div>
                <p class="font-black text-amber-700 mt-4 text-center text-base">● 結論：應改弦更張，不再製造大而無當的包裝，保護後代資源。</p>
            `;
            document.getElementById('name-modal').style.display = 'flex';
        }

        function showFeedback(m, c) { const el = document.getElementById('feedback-area'); el.innerText = m; el.className = "text-center h-6 text-sm font-bold mt-1 " + c; }
        window.onclick = () => document.getElementById('mc-popover').style.display = 'none';
        window.onload = () => {
            document.getElementById('text-canvas').innerHTML = articleText.map(t => `<p class="mb-4">${t}</p>`).join('');
            document.getElementById('final-submit-btn').onclick = () => {
                if(!document.getElementById('user-name').value) return alert("請填寫姓名以生成證書");
                document.getElementById('display-class').innerText = document.getElementById('user-class').value;
                document.getElementById('display-num').innerText = document.getElementById('user-num').value;
                document.getElementById('display-name').innerText = document.getElementById('user-name').value;
                document.getElementById('name-modal').style.display = 'none'; document.getElementById('finish-screen').style.display = 'flex';
            };
            updateTask();
        };
    </script>
</body>
</html>
